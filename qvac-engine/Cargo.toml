[package]
name = "qvac-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# Tether's QVAC SDK for on-device inference
qvac-sdk = "0.1.0" 
# Image processing for local OCR
image = "0.25"
# Fast local LLM execution via ONNX
ort = "2.0" 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
